<rect x="30" y="100" width="200" height="110" rx="6" fill="#FFFFFF" stroke="#16181A" stroke-width="2"/><text x="130.0" y="130" text-anchor="middle" font-family="IBM Plex Sans Condensed, Arial Narrow, sans-serif" font-size="19" font-weight="600" fill="#16181A">Any device</text><text x="130.0" y="156" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13.5" fill="#4A5054">on my LAN</text><text x="130.0" y="176" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13.5" fill="#4A5054">asks for a name</text><rect x="300" y="100" width="200" height="110" rx="6" fill="#FFFFFF" stroke="#16181A" stroke-width="2"/><text x="400.0" y="130" text-anchor="middle" font-family="IBM Plex Sans Condensed, Arial Narrow, sans-serif" font-size="19" font-weight="600" fill="#16181A">Unbound DNS</text><text x="400.0" y="156" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13.5" fill="#4A5054">on OPNsense</text><text x="400.0" y="176" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13.5" fill="#4A5054">logs the query</text><rect x="570" y="100" width="200" height="110" rx="6" fill="#FFFFFF" stroke="#16181A" stroke-width="2"/><text x="670.0" y="130" text-anchor="middle" font-family="IBM Plex Sans Condensed, Arial Narrow, sans-serif" font-size="19" font-weight="600" fill="#16181A">rsyslog</text><text x="670.0" y="156" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13.5" fill="#4A5054">Linux box in lab</text><text x="670.0" y="176" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13.5" fill="#4A5054">own file per device</text><rect x="840" y="100" width="200" height="110" rx="6" fill="#FFFFFF" stroke="#16181A" stroke-width="2"/><text x="940.0" y="130" text-anchor="middle" font-family="IBM Plex Sans Condensed, Arial Narrow, sans-serif" font-size="19" font-weight="600" fill="#16181A">Wazuh agent</text><text x="940.0" y="156" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13.5" fill="#4A5054">tails the file</text><text x="940.0" y="176" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13.5" fill="#4A5054">ships to manager</text><line x1="230" y1="155.0" x2="296" y2="155.0" stroke="#16181A" stroke-width="2" marker-end="url(#a)"/><text x="263.0" y="145.0" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#A0391F">DNS</text><line x1="500" y1="155.0" x2="566" y2="155.0" stroke="#16181A" stroke-width="2" marker-end="url(#a)"/><text x="533.0" y="145.0" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#A0391F">syslog</text><line x1="770" y1="155.0" x2="836" y2="155.0" stroke="#16181A" stroke-width="2" marker-end="url(#a)"/><text x="803.0" y="145.0" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#A0391F">tail</text><rect x="570" y="300" width="470" height="130" rx="6" fill="#F0DED8" stroke="#A0391F" stroke-width="2"/><text x="805.0" y="330" text-anchor="middle" font-family="IBM Plex Sans Condensed, Arial Narrow, sans-serif" font-size="19" font-weight="600" fill="#16181A">Wazuh manager (k3s)</text><text x="805.0" y="356" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13.5" fill="#4A5054">decoder: who asked, name, domain</text><text x="805.0" y="376" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13.5" fill="#4A5054">rule 100200 checks the NRD list</text><text x="805.0" y="396" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13.5" fill="#4A5054">level 10, MITRE T1071.004</text><line x1="940" y1="210" x2="940" y2="296" stroke="#16181A" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="310" width="420" height="110" rx="6" fill="#FFFFFF" stroke="#16181A" stroke-width="2"/><text x="240.0" y="340" text-anchor="middle" font-family="IBM Plex Sans Condensed, Arial Narrow, sans-serif" font-size="19" font-weight="600" fill="#16181A">NRD list</text><text x="240.0" y="366" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13.5" fill="#4A5054">WhoisFreaks daily feed, 30 days</text><text x="240.0" y="386" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13.5" fill="#4A5054">fetch every morning, then deploy</text><text x="240.0" y="406" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13.5" fill="#4A5054">281,201 domains + a canary</text><line x1="450" y1="365" x2="566" y2="365" stroke="#16181A" stroke-width="2" marker-end="url(#a)"/><text x="508.0" y="355" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#A0391F">CDB list</text><rect x="830" y="480" width="210" height="90" rx="6" fill="#FFFFFF" stroke="#16181A" stroke-width="2"/><text x="935.0" y="510" text-anchor="middle" font-family="IBM Plex Sans Condensed, Arial Narrow, sans-serif" font-size="19" font-weight="600" fill="#16181A">Discord</text><text x="935.0" y="536" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13.5" fill="#4A5054">security alerts</text><line x1="940" y1="430" x2="940" y2="476" stroke="#16181A" stroke-width="2" marker-end="url(#a)"/><text x="30" y="545" font-family="IBM Plex Mono, monospace" font-size="13" fill="#4A5054">canary test: dig www.wazuh-nrd-canary.test  -&gt;  alert in seconds</text></svg>