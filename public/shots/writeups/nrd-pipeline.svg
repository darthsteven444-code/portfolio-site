<rect width="1070" height="600" fill="#EDEFEA"/>
<text x="30" y="40" font-family="IBM Plex Sans Condensed, Arial Narrow, sans-serif" font-size="24" font-weight="600" fill="#16181A">Newly registered domain detection</text>
